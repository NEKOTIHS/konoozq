<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    طلب رحلة | كنوز السفر
  </title>

  <link
    rel="icon"
    href="./assets/logo.png"
    type="image/png"
  >

  <link
    rel="stylesheet"
    href="./intake.css"
  >

</head>

<body>

  <main class="intake-page">

    <section class="intake-card">

      <header class="intake-header">

  <img
    src="./assets/logo.png"
    alt="كنوز السفر"
    class="intake-logo"
  >

  <div class="intake-header-content">

    <div class="intake-header-text">

      <span>
        كنوز السفر
      </span>

      <h1>
        صمم رحلتك
      </h1>

      <p>
        ارسل لنا تفاصيل رحلتك وسنتولى إعداد العرض المناسب لك.
      </p>

    </div>


    <button
      id="openImportIntakeBtn"
      class="intake-import-btn"
      type="button"
    >
      استيراد طلب
    </button>

      </header>


      <form id="clientIntakeForm">

        <div class="intake-grid">

          <label>
            <span>
              الاسم *
            </span>

            <input
              id="clientName"
              required
              autocomplete="name"
            >
          </label>


          <label>
            <span>
              رقم الجوال *
            </span>

            <input
              id="phone"
              required
              inputmode="tel"
              dir="ltr"
              autocomplete="tel"
            >
          </label>


          <label>
            <span>
              البريد الإلكتروني
            </span>

            <input
              id="email"
              type="email"
              dir="ltr"
              autocomplete="email"
            >
          </label>


          <label>
            <span>
              مدينة المغادرة
            </span>

            <input
              id="origin"
              placeholder="جدة"
            >
          </label>


          <label class="intake-wide">
            <span>
              الوجهة
            </span>

            <input
              id="destination"
              placeholder="ماليزيا"
            >
          </label>
          <section
  class="trip-stops-section intake-wide"
  id="tripStopsSection"
>

  <div class="trip-stops-header">

    <div>
      <span class="trip-stops-title">
        المدن والإقامات
      </span>

      <p class="trip-stops-help">
        أضف المدن بالترتيب وحدد عدد الليالي ووسيلة الانتقال إلى المدينة التالية.
      </p>
    </div>


    
  </div>


  <div
  id="tripStopsList"
  class="trip-stops-list"
></div>


<button
  id="addTripStopBottomBtn"
  class="trip-stop-add-btn trip-stop-add-bottom-btn"
  type="button"
>
  + إضافة مدينة جديدة
</button>

</section>


<template id="tripStopTemplate">

  <article
    class="trip-stop-card"
    draggable="false"
  >

    <div class="trip-stop-card-head">

      <div class="trip-stop-card-title">

        <button
          type="button"
          class="trip-stop-drag-handle"
          aria-label="تحريك المدينة"
          title="اسحب لتغيير ترتيب المدينة"
        >
          ⋮⋮
        </button>


        <strong class="trip-stop-number">
          المدينة 1
        </strong>

      </div>


      <button
        type="button"
        class="trip-stop-remove-btn"
        aria-label="حذف المدينة"
      >
        حذف
      </button>

    </div>


    <div class="trip-stop-main-grid">

  <label>

    <span>
      المدينة
    </span>

    <input
      class="trip-stop-city"
      type="text"
      placeholder="مثال: جاكرتا"
    >

  <label>

  <span>
    نوع المحطة
  </span>

  <select class="trip-stop-type">

    <option value="stay">
      إقامة
    </option>

    <option value="group">
      مجموعة مناطق فقط
    </option>

    <option value="pass_through">
      عبور فقط
    </option>

  </select>

</label>


<label class="trip-stop-nights-wrap">

  <span>
    عدد الليالي
  </span>

  <input
    class="trip-stop-nights"
    type="number"
    min="1"
    max="60"
    value="2"
    inputmode="numeric"
  >

</label>


  <label class="trip-stop-transport-wrap">

    <span>
      الانتقال إلى المحطة التالية
    </span>

    <select class="trip-stop-transport">

      <option value="best">
        الأفضل حسب المسافة
      </option>

      <option value="domestic_flight">
        طيران داخلي
      </option>

      <option value="private_car">
        سيارة خاصة
      </option>

      <option value="train">
        قطار
      </option>

      <option value="ferry">
        عبّارة
      </option>

      <option value="boat">
        قارب
      </option>

      <option value="shared_transfer">
        نقل مشترك
      </option>

      <option value="no_preference">
        بدون تفضيل
      </option>

    </select>

  </label>

</div>


    <div class="trip-areas-section">

      <div class="trip-areas-head">

        <div>

          <strong>
            المناطق والإقامات
          </strong>

          <small>
            أضف المناطق بالترتيب وحدد الليالي ووسيلة الانتقال.
          </small>

        </div>


        <button
          type="button"
          class="trip-area-add-btn"
        >
          + إضافة منطقة
        </button>

      </div>


      <div class="trip-areas-list"></div>

    </div>

  </article>

</template>


<template id="tripAreaTemplate">

  <div
    class="trip-area-card"
    draggable="false"
  >

    <div class="trip-area-drag">

      <button
        type="button"
        class="trip-area-drag-handle"
        aria-label="تحريك المنطقة"
        title="اسحب لتغيير ترتيب المنطقة"
      >
        ⋮⋮
      </button>

    </div>


    <label>

      <span>
        المنطقة
      </span>

      <input
        class="trip-area-name"
        type="text"
        placeholder="مثال: أوبود"
      >

    </label>


    <label>

  <span>
    نوع المحطة
  </span>

  <select class="trip-area-stop-type">

    <option value="stay">
      إقامة
    </option>

    <option value="pass_through">
      عبور فقط
    </option>

  </select>

</label>


<label class="trip-area-nights-wrap">

  <span>
    عدد الليالي
  </span>

  <input
    class="trip-area-nights"
    type="number"
    min="1"
    max="60"
    value="2"
    inputmode="numeric"
  >

</label>


    <label class="trip-area-transport-wrap">

      <span>
        الانتقال إلى المحطة التالية
      </span>

      <select class="trip-area-transport">

        <option value="best">
          الأفضل حسب المسافة
        </option>

        <option value="domestic_flight">
          طيران داخلي
        </option>

        <option value="private_car">
          سيارة خاصة
        </option>

        <option value="train">
          قطار
        </option>

        <option value="ferry">
          عبّارة
        </option>

        <option value="boat">
          قارب
        </option>

        <option value="shared_transfer">
          نقل مشترك
        </option>

        <option value="no_preference">
          بدون تفضيل
        </option>

      </select>

    </label>


    <button
      type="button"
      class="trip-area-remove-btn"
      aria-label="حذف المنطقة"
      title="حذف المنطقة"
    >
      حذف
    </button>

  </div>

</template>


          <label>
            <span>
              تاريخ السفر
            </span>

            <input
              id="startDate"
              type="date"
            >
          </label>


          <label>
            <span>
              تاريخ العودة
            </span>

            <input
              id="endDate"
              type="date"
            >
          </label>


          <label>
            <span>
              البالغون
            </span>

            <input
              id="adults"
              type="number"
              min="1"
              max="50"
              value="2"
            >
          </label>


          <label>
            <span>
              الأطفال
            </span>

            <input
              id="children"
              type="number"
              min="0"
              max="50"
              value="0"
            >
          </label>
          
          <div
  id="childAgesWrap"
  class="intake-wide"
  hidden
>
  <div
    id="childAgesFields"
    class="child-ages-fields"
  ></div>
</div>


          <label>
            <span>
              ميزانية تقريبية
            </span>

            <input
              id="budget"
              placeholder="مثال: 15,000 ريال"
            >
          </label>


          <label>
            <span>
              تصنيف الفندق
            </span>

            <select id="hotelStars">

              <option value="">
                غير محدد
              </option>

              <option value="3">
                3 نجوم
              </option>

              <option value="4">
                4 نجوم
              </option>

              <option value="5">
                5 نجوم
              </option>

              <option value="4-5">
                4 إلى 5 نجوم
              </option>

            </select>
          </label>


          <label>
            <span>
              درجة الطيران
            </span>

            <select id="flightClass">

              <option value="">
                غير محدد
              </option>

              <option value="سياحية">
                سياحية
              </option>

              <option value="سياحية مميزة">
                سياحية مميزة
              </option>

              <option value="أعمال">
                أعمال
              </option>

              <option value="أولى">
                أولى
              </option>

            </select>
          </label>


          <label>
            <span>
              نوع الرحلة
            </span>

            <select id="tripStyle">

              <option value="">
                غير محدد
              </option>

              <option value="عائلية">
                عائلية
              </option>

              <option value="شهر عسل">
                شهر عسل
              </option>

              <option value="استجمام">
                استجمام
              </option>

              <option value="مغامرات">
                مغامرات
              </option>

              <option value="عمل">
                عمل
              </option>

            </select>
          </label>


          <label class="intake-wide">
            <span>
              ملاحظات أو طلبات خاصة
            </span>

            <textarea
              id="notes"
              rows="6"
              placeholder="مثال: أحتاج سيارة خاصة، غرفة مطلة على البحر، أنشطة للأطفال..."
            ></textarea>
          </label>

        </div>


        <button
          id="submitIntakeBtn"
          class="intake-submit"
          type="submit"
        >
          إرسال طلب الرحلة
        </button>


        <p
          id="intakeStatus"
          class="intake-status"
          hidden
        ></p>

      </form>

    </section>

  </main>


  <dialog
  id="importIntakeDialog"
  class="intake-import-dialog"
>
  <div class="intake-import-dialog-card">

    <div class="intake-import-dialog-head">

      <div>
        <span>
          طلب سابق
        </span>

        <h2>
          استيراد طلب
        </h2>

        <p>
          أدخل رقم الطلب لإعادة تحميل بيانات الرحلة.
        </p>
      </div>


      <button
        id="closeImportIntakeBtn"
        class="intake-dialog-close"
        type="button"
        aria-label="إغلاق"
      >
        ×
      </button>

    </div>


    <div class="intake-import-fields">

  <label class="intake-import-code-field">

    <span>
      رقم الطلب
    </span>

    <input
      id="importIntakeCode"
      type="text"
      placeholder="مثال: KT-ABC123"
      autocomplete="off"
      dir="ltr"
    >

  </label>


  <label class="intake-import-code-field">

    <span>
      رقم الجوال المسجل في الطلب
    </span>

    <input
      id="importIntakePhone"
      type="tel"
      placeholder="05xxxxxxxx"
      autocomplete="tel"
      inputmode="tel"
      dir="ltr"
    >

  </label>

</div>


    <p
      id="importIntakeStatus"
      class="intake-import-status"
      hidden
    ></p>


    <div class="intake-import-dialog-actions">

      <button
        id="cancelImportIntakeBtn"
        class="intake-dialog-secondary"
        type="button"
      >
        إلغاء
      </button>


      <button
        id="loadImportIntakeBtn"
        class="intake-dialog-primary"
        type="button"
      >
        استيراد الطلب
      </button>

    </div>

  </div>
</dialog>


  <script
    src="./intake.js"
    defer
  ></script>

</body>

</html>
